name: Linux packages

on:
  workflow_dispatch:
    inputs:
      runtime_run:
        description: Successful Converter runtimes workflow run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: converter/requirements-test.txt
      - name: Linux prerequisites
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 xvfb dbus-x11 openbox
      - run: npm ci
      - run: npm test
      - run: python -m pip install -r converter/requirements-test.txt
      - run: python -B converter/test_environment.py
      - run: python -B converter/test_service.py
      - run: python -B converter/test_piano_sheet.py
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo test -p lazymidi-core --no-default-features --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: actions/download-artifact@v4
        with:
          name: converter-linux-x86_64-cpu
          run-id: ${{ inputs.runtime_run }}
          github-token: ${{ github.token }}
          path: target/converter-packs
      - name: Install and qualify the downloadable runtime
        env:
          LAZYMIDI_TEST_PACK_MANIFEST: target/converter-packs/linux-x86_64-cpu.json
          LAZYMIDI_TEST_ENVIRONMENT_OUTPUT: target/native-runtime.json
        run: cargo test -p lazymidi --locked built_runtime_installs_and_runs -- --ignored --nocapture
      - run: cargo fetch --locked
      - name: Build Debian and AppImage packages
        run: npm run bundle -- --bundles deb,appimage --config '{"bundle":{"linux":{"deb":{"depends":["libasound2"]}}}}'
      - name: Verify packaged Converter, Piano and floating windows
        env:
          GDK_BACKEND: x11
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: |
          set -euo pipefail
          deb=(target/release/bundle/deb/*.deb)
          image=(target/release/bundle/appimage/*.AppImage)
          test "${#deb[@]}" -eq 1
          test "${#image[@]}" -eq 1
          version=$(node -p "require('./package.json').version")
          test "$(dpkg-deb -f "${deb[0]}" Version)" = "$version"
          dpkg-deb -f "${deb[0]}" Depends | grep -qw libasound2
          mkdir -p "$RUNNER_TEMP/lazymidi-deb" "$RUNNER_TEMP/lazymidi-appimage" target/release/assets
          dpkg-deb -x "${deb[0]}" "$RUNNER_TEMP/lazymidi-deb"
          chmod +x "${image[0]}"
          (cd "$RUNNER_TEMP/lazymidi-appimage" && "$GITHUB_WORKSPACE/${image[0]}" --appimage-extract > /dev/null)
          dbus-run-session -- xvfb-run -a python - <<'PY'
          import os, pathlib, subprocess, sys
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          subprocess.Popen(['openbox', '--sm-disable'], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          for folder, executable in (
              (temp / 'lazymidi-deb', 'usr/bin/lazymidi'),
              (temp / 'lazymidi-appimage/squashfs-root', 'AppRun'),
          ):
              assert (folder / executable).is_file(), executable
              for name in ('service.py', 'check_environment.py', 'THIRD_PARTY_NOTICES'):
                  assert list(folder.rglob(name)), name
              subprocess.run([sys.executable, 'scripts/verify-native-modules.py', str(folder / executable),
                              '--environment', 'target/native-runtime.json'], check=True, timeout=160)
              print(f'Verified {folder.name} packaged frontend, Converter and Piano.')
          PY
          cp "${deb[0]}" "target/release/assets/lazymidi_${version}_amd64.deb"
          cp "${image[0]}" "target/release/assets/lazymidi_${version}_amd64.AppImage"
          cd target/release/assets
          sha256sum *.deb *.AppImage > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lazymidi-linux-x64
          path: target/release/assets/*
          if-no-files-found: error
          retention-days: 30
