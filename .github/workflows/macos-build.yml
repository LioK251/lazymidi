name: macOS DMG

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: aarch64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: converter/requirements-test.txt
      - run: npm ci
      - run: npm test
      - run: python -m pip install -r converter/requirements-test.txt
      - run: python -B converter/test_environment.py
      - run: python -B converter/test_service.py
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo test -p lazymidi-core --no-default-features --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo fetch --locked
      - name: Build ad-hoc signed DMG (not notarized)
        run: npm run bundle -- --bundles dmg --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}'
      - name: Verify packaged app and SDK-free startup
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          dmg=(target/release/bundle/dmg/*.dmg)
          test "${#dmg[@]}" -eq 1
          hdiutil verify "${dmg[0]}"
          mkdir -p "$RUNNER_TEMP/lazymidi-dmg"
          hdiutil attach "${dmg[0]}" -readonly -nobrowse -mountpoint "$RUNNER_TEMP/lazymidi-dmg"
          trap 'hdiutil detach "$RUNNER_TEMP/lazymidi-dmg"' EXIT
          python - <<'PY'
          import json, os, pathlib, plistlib, subprocess, tempfile
          app = pathlib.Path(os.environ['RUNNER_TEMP']) / 'lazymidi-dmg/lazymidi.app'
          info = plistlib.loads((app / 'Contents/Info.plist').read_bytes())
          version = json.loads(pathlib.Path('package.json').read_text())['version']
          assert info['CFBundleShortVersionString'] == version, info
          assert info['LSMinimumSystemVersion'] == '14.0', info
          executable = app / 'Contents/MacOS/lazymidi'
          arch = subprocess.check_output(['lipo', '-archs', str(executable)], text=True).strip()
          expected = 'arm64' if os.environ['EXPECTED_ARCH'] == 'aarch64' else 'x86_64'
          assert arch == expected, arch
          subprocess.run(['codesign', '--verify', '--deep', '--strict', str(app)], check=True)
          resources = app / 'Contents/Resources/_up_'
          for name in ('converter/service.py', 'converter/check_environment.py', 'LICENSE', 'THIRD_PARTY_NOTICES'):
              assert (resources / name).is_file(), name
          with tempfile.TemporaryDirectory() as directory:
              receipt = pathlib.Path(directory) / 'startup.json'
              subprocess.run([str(executable), '--smoke-test', str(receipt)], timeout=60, check=True)
              result = json.loads(receipt.read_text())
              assert result['native_frontend_ready'], result
              state = result['snapshot']
              assert not state['analog_enabled'] and not state['qwerty_enabled'], state
              assert state['sdk_version'] is None, state
          print(f'Verified macOS {arch} DMG, resources, signature and SDK-free frontend startup.')
          PY
          cd target/release/bundle/dmg
          shasum -a 256 *.dmg > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lazymidi-macos-${{ matrix.arch }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/dmg/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
