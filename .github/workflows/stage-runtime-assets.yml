name: Stage runtime release assets
on:
  workflow_dispatch:
    inputs:
      runtime_run:
        description: Successful Converter runtimes workflow run ID
        required: true
        type: string
      tag:
        description: Existing draft release tag
        required: true
        type: string
permissions:
  actions: read
  contents: write
jobs:
  stage:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        pack: [windows-x86_64-cpu, windows-x86_64-cuda, linux-x86_64-cpu, linux-x86_64-cuda, macos-aarch64-cpu, macos-x86_64-cpu]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: converter-${{ matrix.pack }}
          run-id: ${{ inputs.runtime_run }}
          github-token: ${{ github.token }}
          path: packs
      - name: Verify and upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          PACK: ${{ matrix.pack }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess
          tag, repository = os.environ['RELEASE_TAG'], os.environ['GH_REPO']
          assert re.fullmatch(r'v\d+\.\d+\.\d+', tag), tag
          def gh(*args):
              return json.loads(subprocess.check_output(['gh', *args], text=True))
          assert gh('release', 'view', tag, '--json', 'isDraft')['isDraft'], 'Release must still be a draft'
          root = pathlib.Path('packs')
          manifest = root / (os.environ['PACK'] + '.json')
          pack = json.loads(manifest.read_text())
          assert pack['platform'] + '-' + pack['variant'] == os.environ['PACK']
          base = f'https://github.com/{repository}/releases/download/{tag}/'
          def digest(path):
              with path.open('rb') as file:
                  return hashlib.file_digest(file, 'sha256').hexdigest()
          combined = hashlib.sha256()
          def verify(item):
              assert re.fullmatch(r'[A-Za-z0-9_.-]+', item['file'])
              path = root / item['file']
              assert path.stat().st_size == item['bytes'], path
              checksum = hashlib.sha256()
              with path.open('rb') as source:
                  for chunk in iter(lambda: source.read(1024**2), b''):
                      checksum.update(chunk)
                      combined.update(chunk)
              assert checksum.hexdigest() == item['sha256'], path
              return path
          files = []
          if pack['parts']:
              assert sum(p['bytes'] for p in pack['parts']) == pack['bytes']
              for part in pack['parts']:
                  files.append(verify(part))
                  part['url'] = base + part['file']
          else:
              files.append(verify(pack))
              pack['url'] = base + pack['file']
          assert combined.hexdigest() == pack['sha256'], 'Complete archive checksum mismatch'
          assert all(p.stat().st_size < 2 * 1024**3 for p in files)
          manifest.write_text(json.dumps(pack, indent=2) + '\n')
          files.append(manifest)
          subprocess.run(['gh', 'release', 'upload', tag, '--clobber', *map(str, files)], check=True)
          assets = {a['name']: a for a in gh('release', 'view', tag, '--json', 'assets')['assets']}
          for path in files:
              remote = gh('api', assets[path.name]['apiUrl'])
              assert remote['size'] == path.stat().st_size, path
              assert remote['digest'] == 'sha256:' + digest(path), path
              print(path.name, remote['size'], remote['digest'])
          PY
