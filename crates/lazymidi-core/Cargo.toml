[package]
name = "lazymidi-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["wooting"]
wooting = ["dep:libloading"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
midir = "0.11"
libloading = { version = "0.8", optional = true }
directories = "6"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_System_LibraryLoader"] }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
